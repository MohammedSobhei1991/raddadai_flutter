name: Release Android

# Manual only: Actions -> Release Android -> Run workflow.
# Builds a signed APK, publishes it as the repo's latest GitHub release, and
# optionally sends it to Firebase App Distribution.
#
# Testers keep one permanent link that always downloads the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/Raddad-Merchant.apk
# To get an email for every new build: Watch -> Custom -> Releases on the repo.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.0.0)
        type: string
        required: true
      build_number:
        description: Build number (higher than the last one shipped)
        type: string
        required: true
      firebase:
        description: Also upload to Firebase App Distribution
        type: boolean
        default: false
      release_notes:
        description: What's new (optional)
        type: string
        required: false

env:
  FLUTTER_VERSION: 3.47.1
  APP_NAME: Raddad Merchant
  FIREBASE_APP_ID: "1:49095062557:android:07482179e9211a28fcc2f4"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      apk_arm64: ${{ steps.version.outputs.apk_arm64 }}
      apk_universal: ${{ steps.version.outputs.apk_universal }}

    steps:
      - name: Validate inputs
        id: version
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          version="$(echo "$VERSION" | xargs)"
          build_number="$(echo "$BUILD_NUMBER" | xargs)"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.0 (got '$version')."
            exit 1
          fi
          if ! [[ "$build_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number must be a positive whole number (got '$build_number')."
            exit 1
          fi

          base="Raddad-Merchant-${version}-build${build_number}"
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "tag=android-v${version}-build${build_number}"
            echo "apk_arm64=${base}.apk"
            echo "apk_universal=${base}-universal.apk"
          } >> "$GITHUB_OUTPUT"
          echo "### $APP_NAME $version (build $build_number)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android build
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Without the keystore secrets the APK is signed with the runner's
      # throwaway debug key, so each build would refuse to install over the
      # previous one. Add the secrets before sharing builds with testers.
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          PROPS

      # arm64-v8a split: small, runs on practically every current phone.
      # Universal (all ABIs): for old 32-bit phones and emulators; also what
      # Firebase gets.
      - name: Build APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER"

      - name: Set up Firebase CLI
        if: ${{ inputs.firebase }}
        run: npm install -g firebase-tools

      - name: Write service account key
        if: ${{ inputs.firebase }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Distribute to Firebase App Distribution
        if: ${{ inputs.firebase }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          notes="$APP_NAME ${VERSION} (build ${BUILD_NUMBER}), commit ${GITHUB_SHA::7}"
          if [ -n "$RELEASE_NOTES" ]; then
            notes="${notes}"$'\n\n'"${RELEASE_NOTES}"
          fi

          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "internal-testers" \
            --release-notes "$notes"

      - name: Clean up secrets
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase-service-account.json"

      - name: Rename APKs
        env:
          APK_ARM64: ${{ needs.prepare.outputs.apk_arm64 }}
          APK_UNIVERSAL: ${{ needs.prepare.outputs.apk_universal }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/$APK_ARM64"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_UNIVERSAL"
          # Same arm64 APK under a fixed name, for the permanent
          # releases/latest/download/ link.
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Raddad-Merchant.apk

      # Handed to the release job, so publishing can be retried without
      # rebuilding.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs: [prepare, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist

      # Marked as the repo's "Latest" release, which is what the permanent
      # releases/latest/download/ link resolves to. On a re-run the release
      # already exists, so the APKs are replaced instead.
      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          notes="Commit ${GITHUB_SHA::7}"
          if [ -n "$RELEASE_NOTES" ]; then
            notes="${RELEASE_NOTES}"$'\n\n'"${notes}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "$APP_NAME $VERSION (build $BUILD_NUMBER) Android" \
              --notes "$notes" \
              --latest
          fi

          {
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo
            echo "Permanent download link (always the newest build):"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/Raddad-Merchant.apk"
          } >> "$GITHUB_STEP_SUMMARY"
